<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Break-even Calculator — KF Biz</title><link rel="stylesheet" href="../assets/styles.css"> <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
</head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html" aria-label="KF Biz"><img src="../assets/images/kf-biz-logo.png" alt="KF Biz"></a><a class="button button-small" href="../index.html">Back to KF Biz</a></div></header><main class="section"><div class="container" style="max-width:720px"><p class="eyebrow">Free tool</p><h1 style="font-size:52px;letter-spacing:-2px">Break-even Calculator</h1><div class="card" style="margin-top:30px"><label>Monthly fixed costs (€)<input id="fixed" type="number" min="0" step="0.01" placeholder="2000"></label><label style="display:block;margin-top:18px">Selling price per unit (€)<input id="price" type="number" min="0" step="0.01" placeholder="50"></label><label style="display:block;margin-top:18px">Variable cost per unit (€)<input id="variable" type="number" min="0" step="0.01" placeholder="20"></label><button class="button" style="margin-top:20px" onclick="calc()">Calculate</button><div id="result" style="margin-top:25px;font-size:20px"></div></div></div></main><script>function calc(){const f=+fixed.value,p=+price.value,v=+variable.value,m=p-v;if(m<=0){result.textContent='Selling price must be greater than variable cost.';return}const units=f/m,resultSales=units*p;result.innerHTML='<strong>Break-even:</strong> '+units.toFixed(1)+' units/month<br><strong>Break-even sales:</strong> €'+resultSales.toFixed(2)+'/month'}</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then((registration) => console.log("KF Biz service worker registered:", registration.scope))
      .catch((error) => console.error("KF Biz service worker registration failed:", error));
  });
}
</script>
</body></html>
