<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Startup Cost Calculator — KF Biz</title><link rel="stylesheet" href="../assets/styles.css"> <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
</head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html" aria-label="KF Biz"><img src="../assets/images/kf-biz-logo.png" alt="KF Biz"></a><a class="button button-small" href="../index.html">Back to KF Biz</a></div></header><main class="section"><div class="container" style="max-width:720px"><p class="eyebrow">Free tool</p><h1 style="font-size:52px;letter-spacing:-2px">Startup Cost Calculator</h1><div class="card" style="margin-top:30px"><div id="rows"></div><button class="button button-outline" style="margin-top:15px" onclick="addRow()">+ Add cost</button><div id="result" style="margin-top:25px;font-size:22px;font-weight:800">Estimated startup cost: €0.00</div></div></div></main><script>let i=0;function addRow(){i++;const r=document.createElement('div');r.style='display:grid;grid-template-columns:1fr 150px;gap:10px;margin:10px 0';r.innerHTML='<input placeholder="Cost item" aria-label="Cost item"><input type="number" min="0" step="0.01" placeholder="€0" oninput="total()" aria-label="Amount">';document.getElementById('rows').appendChild(r)}function total(){let s=0;document.querySelectorAll('#rows input[type=number]').forEach(x=>s+=Number(x.value)||0);document.getElementById('result').textContent='Estimated startup cost: €'+s.toFixed(2)}addRow();addRow();addRow();</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then((registration) => console.log("KF Biz service worker registered:", registration.scope))
      .catch((error) => console.error("KF Biz service worker registration failed:", error));
  });
}
</script>
</body></html>
