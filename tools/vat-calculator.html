<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAT Calculator — KF Biz</title><link rel="stylesheet" href="../assets/styles.css"> <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
</head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html" aria-label="KF Biz"><img src="../assets/images/kf-biz-logo.png" alt="KF Biz"></a><a class="button button-small" href="../index.html">Back to KF Biz</a></div></header><main class="section"><div class="container" style="max-width:720px"><p class="eyebrow">Free tool</p><h1 style="font-size:52px;letter-spacing:-2px">VAT Calculator</h1><p style="color:var(--muted)">A simple calculator for adding or removing VAT. Enter an amount and choose the calculation.</p><div class="card" style="margin-top:30px"><label>Amount (€)<input id="amount" type="number" min="0" step="0.01" placeholder="100"></label><label style="display:block;margin-top:18px">VAT rate (%)<input id="rate" type="number" min="0" step="0.1" value="25.5"></label><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="button" onclick="calc('add')">Add VAT</button><button class="button button-outline" onclick="calc('remove')">Remove VAT</button></div><div id="result" style="margin-top:25px;font-size:18px"></div></div><p style="font-size:13px;color:var(--muted);margin-top:20px">For illustration only. Check the applicable Finnish VAT rules for your situation.</p></div></main><script>function calc(mode){const a=Number(document.getElementById('amount').value),r=Number(document.getElementById('rate').value)/100;if(!isFinite(a)||!isFinite(r)){return}let net,gross,vat;if(mode==='add'){net=a;vat=a*r;gross=a+vat}else{gross=a;net=a/(1+r);vat=gross-net}document.getElementById('result').innerHTML='<strong>Net:</strong> €'+net.toFixed(2)+' &nbsp; <strong>VAT:</strong> €'+vat.toFixed(2)+' &nbsp; <strong>Total:</strong> €'+gross.toFixed(2)}</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then((registration) => console.log("KF Biz service worker registered:", registration.scope))
      .catch((error) => console.error("KF Biz service worker registration failed:", error));
  });
}
</script>
</body></html>
